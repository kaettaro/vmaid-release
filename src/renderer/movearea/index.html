<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- 外部オリジン禁止。範囲の窓は、自分の中で描くだけ(通信しない) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VMaid 移動範囲</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font-family: system-ui, 'Yu Gothic UI', sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
      }
      #bar {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 16px;
        border-radius: 10px;
        background: rgba(20, 22, 30, 0.92);
        color: #f2f3f8;
        font-size: 13px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      }
      #bar button {
        font: inherit;
        padding: 5px 14px;
        border-radius: 6px;
        border: 1px solid #5b6078;
        background: #2b2e3d;
        color: inherit;
        cursor: pointer;
      }
      #bar button.primary {
        background: #6b5bd6;
        border-color: #8a7cf0;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="bar">
      <span>ドラッグで、動ける範囲を描く(キャラの窓が、この中に収まります)。四角の中をドラッグで移動・角で大きさ・Delete で削除</span>
      <button id="clear">全部消す</button>
      <button id="cancel">取り消し (Esc)</button>
      <button id="save" class="primary">保存 (Enter)</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
