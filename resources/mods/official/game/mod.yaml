# ○×ゲーム Mod(公式)。○×(三目並べ)を、盤面の窓とチャットで、キャラと遊べる。
# 機能(盤面の窓・ルールのトリガーとアクション)と、基本の反応(始める言葉・手・勝ち・負け・引き分けのセリフ・表情・モーション)が、1 つになっている。素材は含まない(内蔵のモーションだけを使う)。
# 基本の反応を消したいときは、Mod タブで、ルールを個別に OFF にする。自分の反応は、「ルール」タブで作る。
id: game
name: ○×ゲーム
version: "0.3.0"
feature: game
description: キャラと、○×(三目並べ)で遊べます。盤面の窓をクリックするか、チャットで「5」「3の2」「左上」と打って遊びます。「まるばつしよう」と入力すると始まり、勝ち・負け・引き分けに、キャラが反応します。キャラの強さ・先攻は、この Mod の設定です。
slots:
  - id: start-words
    label: ゲームを始める言葉
    kind: text
    default: まるばつ,マルバツ,三目並べ,さんもくならべ
    hint: カンマ・読点で区切って、複数。「まるばつしよう」のように、入力に含まれていれば、ゲームが始まります(○ や × の記号は、トリガーワードでは、無視されるので、使えません)。ふだんの会話に出る言葉は、入れないでください。
  - id: start-lines
    group: セリフ
    label: 始めるときのセリフ
    kind: lines
    default: |
      いいよ、やろう!
      ○×だね。負けないよ!
      あなたが○、わたしが×ね
  - id: char-move-lines
    group: セリフ
    label: キャラが 1 手打ったときのセリフ
    kind: lines
    default: |
      ここだよ!
      うーん、こう!
      えいっ
      どうかな?
  - id: user-win-lines
    group: セリフ
    label: あなたが勝ったときのセリフ
    kind: lines
    default: |
      あー、負けちゃった…!
      くやしい! もう一回やろう!
      つよいね…!
  - id: user-lose-lines
    group: セリフ
    label: あなたが負けたときのセリフ
    kind: lines
    default: |
      やった、わたしの勝ち!
      えへへ、勝っちゃった
      もう一回やる?
  - id: draw-lines
    group: セリフ
    label: 引き分けのセリフ
    kind: lines
    default: |
      引き分けだね
      いい勝負だった!
      次は負けないよ
rules:
  - id: start
    description: 「まるばつしよう」と入力すると、ゲームを始める(AI には送らない)
    when: { trigger: userMessage, keywords: ["{{slot:start-words}}"] }
    do:
      - { action: say, text: ["{{slot:start-lines}}"] }
      - { action: startGame, game: tictactoe }

  - id: char-move
    description: キャラが 1 手打ったとき、ひとこと言う
    when: { trigger: gameMove, who: char, game: tictactoe }
    do:
      - { action: say, text: ["{{slot:char-move-lines}}"] }
      - { action: playMotion, motion: nod }

  - id: user-win
    description: ユーザーが勝ったとき(くやしがる)
    when: { trigger: gameResult, result: win, game: tictactoe }
    do:
      - { action: say, text: ["{{slot:user-win-lines}}"] }
      - { action: setExpression, name: sad, value: 0.6, durationSec: 4 }
      - { action: playMotion, motion: sad }

  - id: user-lose
    description: ユーザーが負けたとき(よろこぶ)
    when: { trigger: gameResult, result: lose, game: tictactoe }
    do:
      - { action: say, text: ["{{slot:user-lose-lines}}"] }
      - { action: setExpression, name: happy, value: 0.8, durationSec: 4 }
      - { action: playMotion, motion: happyHop }

  - id: draw
    description: 引き分けのとき
    when: { trigger: gameResult, result: draw, game: tictactoe }
    do:
      - { action: say, text: ["{{slot:draw-lines}}"] }
      - { action: setExpression, name: relaxed, value: 0.6, durationSec: 3 }
